# Python Worker project. Deployed with `uv run pywrangler deploy` (see .github/workflows/ci.yml).
# Only runtime packages the API needs on Cloudflare: no uvicorn (the Workers runtime is the
# ASGI server) and no test tooling. Compiled packages (pydantic-core, asyncpg) come from
# Pyodide's builds, so versions are left to the resolver rather than pinned to CPython wheels.
[project]
name = "dealerdesk-worker"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/app"]  # copied from backend/ at deploy time; linted there

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["workers"]
