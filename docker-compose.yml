# Local development database only.
# CI uses a GitHub Actions service container with the same image and credentials.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealer
      POSTGRES_PASSWORD: dealer
      POSTGRES_DB: dealership
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealer -d dealership"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
